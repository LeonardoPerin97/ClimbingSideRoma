name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps config

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: climbingside_test
          POSTGRES_USER: climbingside
          POSTGRES_PASSWORD: climbingside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U climbingside -d climbingside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://climbingside:climbingside@localhost:5432/climbingside_test
      DJANGO_SECRET_KEY: ci-only-secret
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py check

