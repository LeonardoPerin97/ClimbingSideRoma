{% load i18n %}

<div data-discipline-histogram>
    <div class="histogram-toolbar">
        <div class="histogram-type-filter" role="group" aria-label="{% translate 'Type' %}">
            <button class="histogram-type-button is-active" type="button" data-histogram-filter="all" aria-pressed="true">{% translate "All" %}</button>
            <button class="histogram-type-button" type="button" data-histogram-filter="route" aria-pressed="false">{% translate "Routes" %}</button>
            <button class="histogram-type-button" type="button" data-histogram-filter="boulder" aria-pressed="false">{% translate "Boulders" %}</button>
        </div>
        <div class="discipline-histogram-legend" aria-label="{% translate 'Histogram legend' %}">
            <span data-histogram-legend="route"><i class="histogram-legend-swatch is-route" aria-hidden="true"></i>{% translate "Routes" %}</span>
            <span data-histogram-legend="boulder"><i class="histogram-legend-swatch is-boulder" aria-hidden="true"></i>{% translate "Boulders" %}</span>
        </div>
    </div>
    <div class="histogram-scroll" tabindex="0" aria-label="{{ histogram_scroll_label }}">
        <div class="grade-histogram">
            <div class="histogram-y-axis" aria-hidden="true">
                <span data-histogram-y-maximum>{{ maximum_count }}</span>
                <span>0</span>
            </div>
            <div class="histogram-plot" role="list" aria-label="{{ histogram_content_label }}">
                {% for bucket in buckets %}
                    <div
                        class="histogram-column"
                        role="listitem"
                        data-route-count="{{ bucket.routes }}"
                        data-boulder-count="{{ bucket.boulders }}"
                        aria-label="{% blocktranslate with grade=bucket.label total=bucket.total routes=bucket.routes boulders=bucket.boulders %}Grade {{ grade }}: {{ total }} total, {{ routes }} routes, {{ boulders }} boulders{% endblocktranslate %}"
                    >
                        <span class="histogram-value" data-histogram-value aria-hidden="true">{{ bucket.total }}</span>
                        <span class="histogram-track" aria-hidden="true">
                            <span
                                class="histogram-stacked-bar{% if not bucket.total %} is-zero{% endif %}"
                                data-histogram-bar
                                style="--histogram-height: {% widthratio bucket.total maximum_count 100 %}%;"
                            >
                                <span class="histogram-segment is-boulder" data-histogram-segment="boulder" style="--segment-count: {{ bucket.boulders }};"></span>
                                <span class="histogram-segment is-route" data-histogram-segment="route" style="--segment-count: {{ bucket.routes }};"></span>
                            </span>
                        </span>
                        <span class="histogram-label" aria-hidden="true">{{ bucket.label }}</span>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
