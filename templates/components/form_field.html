<div class="form-group{% if extra_class %} {{ extra_class }}{% endif %}{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <div class="form-help" id="{{ field.id_for_label }}-help">{{ field.help_text|safe }}</div>
    {% endif %}
    {% if field.errors %}
        <div class="field-errors" id="{{ field.id_for_label }}-errors" role="alert">
            {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
        </div>
    {% endif %}
</div>
