{% load i18n %}
<p>{% blocktranslate with username=user.get_username %}Hello {{ username }},{% endblocktranslate %}</p>
<p>{% translate "Open the following link to choose a new password:" %}</p>
<p><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}">{% translate "Reset password" %}</a></p>
<p>{% translate "If you did not request a password reset, ignore this email." %}</p>
