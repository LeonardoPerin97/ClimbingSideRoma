services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: climbingside
      POSTGRES_USER: climbingside
      POSTGRES_PASSWORD: climbingside
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climbingside -d climbingside"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: local-docker-secret-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DATABASE_URL: postgresql://climbingside:climbingside@db:5432/climbingside
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

